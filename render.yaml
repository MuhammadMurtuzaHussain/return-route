# Hosted demo on Render. The server's Gemma runs on Google AI Studio (Render has
# no GPUs); the phone tier runs Gemma 4 E2B in the visitor's own browser either way.
# For a fully private setup, run Return Route locally with Ollama instead.
services:
  - type: web
    name: return-route
    runtime: node
    plan: free
    # Render's /usr/bin is read-only, so call pnpm through corepack instead of `corepack enable`.
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: corepack pnpm start
    healthCheckPath: /api/status
    envVars:
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: MODEL_PROVIDER
        value: google
      - key: GOOGLE_MODEL
        value: gemma-4-26b-a4b-it
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_EDGE_MODEL
        value: onnx-community/gemma-4-E2B-it-ONNX
      - key: SITE_URL
        value: https://return-route.onrender.com
      # Shared cache for Overpass areas, today's events and the rate limits.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: return-route-cache
          property: connectionString
      # Sentry: traces of every plan and Gemma call, and an issue whenever the guard overrules Gemma.
      # A DSN only lets you send events, so it is fine in the repo.
      - key: SENTRY_DSN
        value: https://993f4d4277baf9b811750c265de6b040@o4512237895417856.ingest.de.sentry.io/4512237905444944
      - key: NEXT_PUBLIC_SENTRY_DSN
        value: https://993f4d4277baf9b811750c265de6b040@o4512237895417856.ingest.de.sentry.io/4512237905444944
      # Optional: readable stack traces (source map upload at build time).
      - key: SENTRY_AUTH_TOKEN
        sync: false
      # Optional: what's on in town today (Google Events via SerpApi).
      - key: SERPAPI_KEY
        sync: false

  # Render Key Value (Valkey). Internal only: nothing outside Render can reach it.
  - type: keyvalue
    name: return-route-cache
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
